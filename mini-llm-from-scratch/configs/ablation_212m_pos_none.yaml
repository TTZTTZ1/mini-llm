project:
  name: mini-llm-from-scratch
  run_name: ablation_212m_pos_none_ctx1024
data:
  raw_dir: data/raw
  cleaned_text: data/processed/fineweb_edu_tokenizer_corpus.txt
  train_bin: data/processed/fineweb_edu_train.bin
  val_bin: data/processed/fineweb_edu_val.bin
  tokenizer_path: data/tokenizer/fineweb_edu_bpe_32000.json
  vocab_size: 32000
  val_fraction: 0.006211
model:
  n_layer: 16
  n_head: 14
  n_embd: 896
  block_size: 1024
  vocab_size: 32000
  dropout: 0.1
  position_encoding: none
train:
  seed: 42
  device: cuda
  dtype: bfloat16
  batch_size: 24
  max_steps: 130209
  eval_interval: 2000
  eval_iters: 100
  learning_rate: 0.00025
  weight_decay: 0.1
  grad_clip: 1.0
  out_dir: results/runs/ablation_212m_pos_none_ctx1024
generate:
  max_new_tokens: 256
  temperature: 0.9
  top_k: 50
  top_p: 0.9
