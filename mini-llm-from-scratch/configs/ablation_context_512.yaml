project:
  name: mini-llm-from-scratch
  run_name: context_512
data:
  raw_dir: data/raw
  cleaned_text: data/processed/thucnews_clean.txt
  train_bin: data/processed/train.bin
  val_bin: data/processed/val.bin
  tokenizer_path: data/tokenizer/bpe_16000.json
  vocab_size: 16000
  val_fraction: 0.05
model:
  n_layer: 4
  n_head: 4
  n_embd: 256
  block_size: 512
  vocab_size: 16000
  dropout: 0.1
  position_encoding: learned_abs
train:
  seed: 42
  device: cuda
  dtype: bfloat16
  batch_size: 32
  max_steps: 5000
  eval_interval: 250
  eval_iters: 50
  learning_rate: 0.0003
  weight_decay: 0.1
  grad_clip: 1.0
  out_dir: results/runs/context_512
generate:
  max_new_tokens: 128
  temperature: 0.9
  top_k: 50
  top_p: 0.9
